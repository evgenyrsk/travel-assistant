name: Core verification

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: core-verification-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify core
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: |
            services/backend/build.gradle.kts
            services/backend/settings.gradle.kts
            services/backend/gradle/wrapper/gradle-wrapper.properties

      - name: Set up Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: tools/openapi-conformance/package-lock.json

      - name: Install OpenAPI conformance dependencies
        run: npm ci --ignore-scripts --prefix tools/openapi-conformance

      - name: Run core verification
        run: ./scripts/verify.sh core
