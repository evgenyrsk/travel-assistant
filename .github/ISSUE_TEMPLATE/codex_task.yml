name: Задача для Codex
description: Маленькая поэтапная задача реализации или документации для Codex/opencode.
title: "[Задача Codex]: "
labels: ["codex-task"]
body:
  - type: markdown
    attributes:
      value: |
        Используй эту форму для маленьких задач с явным текущим этапом и границами задачи.
        Canonical repository governance находится в AGENTS.md; эта форма не дублирует полный набор правил Codex.

  - type: textarea
    id: context
    attributes:
      label: Контекст
      description: Краткий контекст, ссылки на обсуждения, документы или предыдущие задачи.
      placeholder: |
        Кратко опиши, почему нужна задача и к какому продуктово-техническому контексту она относится.
    validations:
      required: true

  - type: input
    id: current-stage
    attributes:
      label: Текущий этап
      description: Этап roadmap или веха, в рамках которой должна выполняться задача.
      placeholder: "Например: настройка репозитория и процесса / веха 0"
    validations:
      required: true

  - type: dropdown
    id: task-type
    attributes:
      label: Тип задачи
      description: Выбери основной тип работы.
      options:
        - Документация
        - GitHub/Codex workflow
        - Продукт/требования
        - Архитектура/API-контракты
        - Backend
        - AI/оркестрация
        - Поиск travel-предложений
        - Frontend/UI
        - Тестирование/качество
        - Безопасность/наблюдаемость
    validations:
      required: true

  - type: textarea
    id: required-reading
    attributes:
      label: Что прочитать перед началом
      description: Документы и файлы, которые Codex должен прочитать до изменений.
      placeholder: |
        - AGENTS.md
        - README.md
        - docs/roadmap/roadmap.md
        - docs/ROADMAP.md
        - релевантные baseline/ADR/docs для задачи
    validations:
      required: true

  - type: textarea
    id: task
    attributes:
      label: Задача
      description: Что нужно сделать в рамках этой задачи.
      placeholder: |
        Опиши одну маленькую атомарную задачу.
        Укажи, что считается завершением задачи.
    validations:
      required: true

  - type: textarea
    id: expected-changes
    attributes:
      label: Ожидаемые изменения
      description: Какие файлы, документы или модули ожидается создать, обновить или проверить.
      placeholder: |
        - Создать:
        - Обновить:
        - Проверить:
    validations:
      required: true

  - type: textarea
    id: forbidden-changes
    attributes:
      label: Что нельзя менять
      description: Явные запреты для защиты roadmap, границ задачи и unrelated files.
      value: |
        - Соблюдать AGENTS.md как canonical repository governance.
        - Не начинать следующий roadmap stage без явного запроса.
        - Не расширять task scope.
        - Не трогать unrelated files.
        - Не менять architecture decisions, MVP scope или roadmap порядок без явного запроса.
    validations:
      required: true

  - type: textarea
    id: acceptance-criteria
    attributes:
      label: Критерии приемки
      description: Конкретные проверки, подтверждающие выполнение задачи.
      placeholder: |
        - ...
        - ...
    validations:
      required: true

  - type: textarea
    id: final-report-format
    attributes:
      label: Финальный отчёт
      description: Формат, который Codex должен использовать в отчете о завершении.
      value: |
        Использовать обязательный формат из AGENTS.md, если задача не задает более конкретный формат.
    validations:
      required: true
