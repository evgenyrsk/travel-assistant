openapi: 3.1.0
info:
  title: Travel Assistant MVP Hotel API
  summary: Draft frontend/backend API contract for the hotel-only MVP.
  version: 0.2.0-draft
  description: >
    Draft Travel Assistant MVP v1 contract. Stage 10.3 aligns the bounded
    chat-first subset with runtime behavior without promoting the whole
    OpenAPI document to generated-client readiness. The API is hotel-only and
    provider-neutral.
jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema
servers:
  - url: /api/v1
    description: Relative API base path for local and deployed clients.
tags:
  - name: Health
  - name: Assistant
  - name: Hotel Search
  - name: Shortlist

paths:
  /health:
    get:
      tags:
        - Health
      summary: Check backend availability.
      operationId: getHealth
      responses:
        "200":
          description: Backend is available.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
        "500":
          $ref: "#/components/responses/InternalError"

  /assistant/sessions:
    post:
      tags:
        - Assistant
      summary: Create a new assistant session.
      description: >
        Starts a hotel-only assistant session. The optional initial message can
        begin intent capture and clarification. The session is current-session
        state only and does not imply account history or cross-device storage.
        If the request body is omitted, the backend creates a session without an
        initial user message. If an application/json body is provided, it follows
        AssistantMessageRequest. Malformed JSON, unsupported JSON shapes, and
        unknown fields produce VALIDATION_ERROR for body.
      operationId: createAssistantSession
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssistantMessageRequest"
      responses:
        "201":
          description: Assistant session created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssistantMessageResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "500":
          $ref: "#/components/responses/InternalError"

  /assistant/sessions/{sessionId}/messages:
    post:
      tags:
        - Assistant
      summary: Continue an assistant session.
      description: >
        Adds a user message to an existing hotel-only assistant session and
        returns the assistant response and updated session state. The request
        body is required and follows AssistantMessageRequest. Malformed JSON,
        unsupported JSON shapes, and unknown fields produce VALIDATION_ERROR
        for body.
      operationId: continueAssistantSession
      parameters:
        - $ref: "#/components/parameters/SessionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssistantMessageRequest"
      responses:
        "200":
          description: Assistant response for the session turn.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssistantMessageResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "404":
          $ref: "#/components/responses/SessionNotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /hotel-searches:
    post:
      tags:
        - Hotel Search
      summary: Create a hotel search request.
      description: >
        Diagnostic endpoint for direct hotel search checks. It is not part of
        the bounded platform-client contract; regular clients use the assistant
        session flow and then load offers by opaque searchId.
      operationId: createHotelSearch
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/HotelSearchRequest"
      responses:
        "202":
          description: Hotel search accepted for processing.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HotelSearchResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "404":
          $ref: "#/components/responses/SessionNotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /hotel-searches/{searchId}/offers:
    get:
      tags:
        - Hotel Search
      summary: Get hotel offers for a search.
      description: >
        Returns a terminal hotel result for an opaque searchId created by the
        assistant flow. The envelope is provider-neutral and contains no
        provider DTO.
      operationId: getHotelOffers
      parameters:
        - $ref: "#/components/parameters/SearchId"
      responses:
        "200":
          description: Hotel search result envelope, including terminal search states.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HotelOffersResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "404":
          $ref: "#/components/responses/HotelSearchNotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /assistant/sessions/{sessionId}/shortlist:
    get:
      tags:
        - Shortlist
      summary: Get the current-session shortlist.
      description: >
        Returns shortlisted hotel offers for the current assistant session. The
        shortlist is not account history, persistent saved trips, booking,
        payment, or guaranteed fresh availability.
      operationId: getSessionShortlist
      parameters:
        - $ref: "#/components/parameters/SessionId"
      responses:
        "200":
          description: Current-session shortlist.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShortlistResponse"
        "404":
          $ref: "#/components/responses/SessionNotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /assistant/sessions/{sessionId}/shortlist/{offerId}:
    put:
      tags:
        - Shortlist
      summary: Add or update a hotel offer in the current-session shortlist.
      operationId: upsertShortlistItem
      parameters:
        - $ref: "#/components/parameters/SessionId"
        - $ref: "#/components/parameters/OfferId"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ShortlistItemRequest"
      responses:
        "200":
          description: Shortlist item added or updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ShortlistItem"
        "400":
          $ref: "#/components/responses/ValidationError"
        "404":
          $ref: "#/components/responses/SessionOrHotelOfferNotFound"
        "500":
          $ref: "#/components/responses/InternalError"
    delete:
      tags:
        - Shortlist
      summary: Remove a hotel offer from the current-session shortlist.
      operationId: removeShortlistItem
      parameters:
        - $ref: "#/components/parameters/SessionId"
        - $ref: "#/components/parameters/OfferId"
      responses:
        "204":
          description: Shortlist item removed.
        "404":
          $ref: "#/components/responses/SessionOrShortlistItemNotFound"
        "500":
          $ref: "#/components/responses/InternalError"

  /assistant/sessions/{sessionId}/explanations:
    post:
      tags:
        - Assistant
      summary: Explain or compare hotel offers.
      description: >
        Produces assistant explanation or comparison text for hotel offers in an
        existing session. Explanations must be grounded in user-provided
        constraints and provider facts, with assumptions and unknown data kept
        visible.
      operationId: createAssistantExplanation
      parameters:
        - $ref: "#/components/parameters/SessionId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AssistantExplanationRequest"
      responses:
        "200":
          description: Assistant explanation or comparison.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AssistantExplanationResponse"
        "400":
          $ref: "#/components/responses/ValidationError"
        "404":
          $ref: "#/components/responses/SessionOrHotelOfferNotFound"
        "500":
          $ref: "#/components/responses/InternalError"

components:
  parameters:
    SessionId:
      name: sessionId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
      description: Opaque assistant session identifier.
    SearchId:
      name: searchId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
      description: Opaque hotel search identifier.
    OfferId:
      name: offerId
      in: path
      required: true
      schema:
        type: string
        minLength: 1
      description: Opaque hotel offer identifier.

  responses:
    ValidationError:
      description: Request validation failed.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ValidationErrorResponse"
          examples:
            missingDestination:
              value:
                code: VALIDATION_ERROR
                message: Destination is required for hotel search.
                requestId: req_123
                fields:
                  - field: criteria.destination
                    message: Destination is required.
    HotelSearchNotFound:
      description: Hotel search was not found.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          examples:
            hotelSearchNotFound:
              value:
                code: HOTEL_SEARCH_NOT_FOUND
                message: Hotel search was not found.
                requestId: req_123
    HotelOfferNotFound:
      description: Hotel offer was not found in the current session or search context.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          examples:
            hotelOfferNotFound:
              value:
                code: HOTEL_OFFER_NOT_FOUND
                message: Hotel offer was not found.
                requestId: req_123
    SessionOrHotelOfferNotFound:
      description: Assistant session or hotel offer was not found.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          examples:
            sessionNotFound:
              value:
                code: SESSION_NOT_FOUND
                message: Assistant session was not found.
                requestId: req_123
            hotelOfferNotFound:
              value:
                code: HOTEL_OFFER_NOT_FOUND
                message: Hotel offer was not found.
                requestId: req_123
    ShortlistItemNotFound:
      description: Shortlist item was not found.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          examples:
            shortlistItemNotFound:
              value:
                code: SHORTLIST_ITEM_NOT_FOUND
                message: Shortlist item was not found.
                requestId: req_123
    SessionOrShortlistItemNotFound:
      description: Assistant session or shortlist item was not found.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          examples:
            sessionNotFound:
              value:
                code: SESSION_NOT_FOUND
                message: Assistant session was not found.
                requestId: req_123
            shortlistItemNotFound:
              value:
                code: SHORTLIST_ITEM_NOT_FOUND
                message: Shortlist item was not found.
                requestId: req_123
    SessionNotFound:
      description: Assistant session was not found.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          examples:
            sessionNotFound:
              value:
                code: SESSION_NOT_FOUND
                message: Assistant session was not found.
                requestId: req_123
    InternalError:
      description: Internal server error.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          examples:
            internal:
              value:
                code: INTERNAL_ERROR
                message: Internal server error.
                requestId: req_123

  schemas:
    HealthResponse:
      type: object
      required:
        - status
        - service
        - version
      properties:
        status:
          type: string
          enum:
            - ok
        service:
          type: string
          example: travel-assistant-backend
        version:
          type: string
          example: 0.1.0
        currentTime:
          type: string
          format: date-time
      additionalProperties: false

    AssistantSession:
      type: object
      description: >
        Current-session assistant state. It may be resumed only while the
        opaque session exists; no account history, cross-device sync,
        long-term persistence, or page-refresh guarantee is implied.
      required:
        - sessionId
        - status
        - createdAt
        - updatedAt
      properties:
        sessionId:
          type: string
          description: Opaque current-session identifier.
        status:
          type: string
          enum:
            - collecting_requirements
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      additionalProperties: false

    AssistantMessageRequest:
      type: object
      description: >
        Platform-neutral assistant user text. message is required when a JSON
        body is provided and must contain from 1 to 4000 Unicode code points.
        clientContext is optional behavior-neutral client hint data.
      required:
        - message
      properties:
        message:
          type: string
          minLength: 1
          maxLength: 4000
          description: >
            User message passed to application logic unchanged after successful
            JSON, non-blank, and Unicode length validation.
        clientContext:
          type: object
          description: >
            Optional client hint container. Its fields do not change behavior in
            the current bounded contract.
          additionalProperties: false
          properties:
            locale:
              type: string
              example: en-US
            timezone:
              type: string
              example: Europe/Moscow
      additionalProperties: false

    AssistantMessageResponse:
      type: object
      required:
        - session
        - assistantMessage
        - nextAction
      allOf:
        - if:
            properties:
              nextAction:
                const: show_hotel_results
            required:
              - nextAction
          then:
            required:
              - hotelSearchId
          else:
            not:
              required:
                - hotelSearchId
      properties:
        session:
          $ref: "#/components/schemas/AssistantSession"
        assistantMessage:
          $ref: "#/components/schemas/AssistantMessage"
        nextAction:
          type: string
          description: >
            Required platform-neutral client action for the current turn.
          enum:
            - ask_clarification
            - show_hotel_results
            - show_boundary_message
        hotelSearchId:
          type: string
          description: >
            Optional opaque identifier of a hotel search created by the current
            assistant message. It is required only when nextAction is
            show_hotel_results and absent for every other nextAction.
      additionalProperties: false

    AssistantMessage:
      type: object
      required:
        - role
        - content
      properties:
        role:
          type: string
          enum:
            - assistant
        content:
          type: string
      additionalProperties: false

    SearchIntentSummary:
      type: object
      description: >
        User-facing summary of hotel search intent. It separates confirmed user
        constraints, assistant assumptions, and unknown data.
      additionalProperties: false
      properties:
        criteria:
          $ref: "#/components/schemas/HotelSearchCriteria"
        userProvidedConstraints:
          type: array
          items:
            type: string
        userPreferences:
          type: array
          items:
            $ref: "#/components/schemas/UserPreference"
        assistantAssumptions:
          type: array
          items:
            $ref: "#/components/schemas/AssistantAssumption"
        derivedAssumptions:
          type: array
          items:
            $ref: "#/components/schemas/DerivedAssumption"
        unknowns:
          type: array
          items:
            $ref: "#/components/schemas/UnknownData"
        missingRequiredFields:
          type: array
          items:
            type: string

    HotelSearchRequest:
      type: object
      required:
        - sessionId
        - criteria
      properties:
        sessionId:
          type: string
        criteria:
          $ref: "#/components/schemas/HotelSearchCriteria"
        searchIntentSummary:
          $ref: "#/components/schemas/SearchIntentSummary"
      additionalProperties: false

    HotelSearchCriteria:
      type: object
      required:
        - destination
        - checkInDate
        - checkOutDate
        - guests
      properties:
        destination:
          type: string
          minLength: 1
          description: Hotel destination as understood from user input or clarification.
        checkInDate:
          type: string
          format: date
        checkOutDate:
          type: string
          format: date
        guests:
          type: object
          required:
            - adults
          properties:
            adults:
              type: integer
              minimum: 1
            children:
              type: integer
              minimum: 0
              default: 0
              description: >
                Transitional child count. When positive, childrenAges must
                contain one age for every child.
            childrenAges:
              type: array
              description: >
                Ages of all children. Every explicitly declared child requires
                an age; order is preserved.
              items:
                type: integer
                minimum: 0
                maximum: 17
          additionalProperties: false
        rooms:
          type: integer
          minimum: 1
          description: >
            Explicit room count. If omitted, a visible room_count
            DerivedAssumption must be present before hotel search starts.
        budget:
          type: object
          properties:
            min:
              type: number
              minimum: 0
            max:
              type: number
              minimum: 0
            currency:
              type: string
              minLength: 3
              maxLength: 3
              example: EUR
          additionalProperties: false
        preferences:
          type: array
          items:
            $ref: "#/components/schemas/UserPreference"
          description: User-stated preferences or soft constraints.
        requiredAmenities:
          type: array
          items:
            type: string
        assistantAssumptions:
          type: array
          items:
            $ref: "#/components/schemas/AssistantAssumption"
        derivedAssumptions:
          type: array
          description: >
            Required for visible room or guest assumptions when explicit fields
            are omitted or inferred.
          items:
            $ref: "#/components/schemas/DerivedAssumption"
        unknowns:
          type: array
          items:
            $ref: "#/components/schemas/UnknownData"
      additionalProperties: false

    HotelSearchResponse:
      type: object
      required:
        - searchId
        - sessionId
        - status
        - criteria
        - metadata
      properties:
        searchId:
          type: string
        sessionId:
          type: string
        status:
          type: string
          enum:
            - completed_with_offers
            - completed_no_offers
        criteria:
          $ref: "#/components/schemas/HotelSearchCriteriaResponse"
        metadata:
          $ref: "#/components/schemas/SearchResultMetadata"
      additionalProperties: false

    HotelOffersResponse:
      type: object
      required:
        - searchId
        - status
        - offers
        - metadata
        - providerFacts
      properties:
        searchId:
          type: string
        status:
          type: string
          enum:
            - completed_with_offers
            - completed_no_offers
        offers:
          type: array
          items:
            $ref: "#/components/schemas/HotelOffer"
        metadata:
          $ref: "#/components/schemas/SearchResultMetadata"
        providerFacts:
          type: array
          items:
            $ref: "#/components/schemas/ProviderFact"
        appliedPreferences:
          $ref: "#/components/schemas/AppliedHotelSearchPreferences"
          description: Omitted when the search has no active optional preferences.
        refinementSuggestion:
          $ref: "#/components/schemas/HotelSearchRefinementSuggestion"
          description: Omitted unless a completed empty search has one active preference that can be relaxed.
      additionalProperties: false

    HotelSearchCriteriaResponse:
      type: object
      required:
        - destination
        - checkInDate
        - checkOutDate
        - guests
      properties:
        destination:
          type: string
        checkInDate:
          type: string
          format: date
        checkOutDate:
          type: string
          format: date
        guests:
          type: object
          required:
            - adults
            - children
            - childrenAges
          properties:
            adults:
              type: integer
              minimum: 1
            children:
              type: integer
              minimum: 0
            childrenAges:
              type: array
              items:
                type: integer
                minimum: 0
                maximum: 17
          additionalProperties: false
        rooms:
          type: integer
          minimum: 1
      additionalProperties: false

    AppliedHotelSearchPreferences:
      type: object
      properties:
        maxTotalPrice:
          $ref: "#/components/schemas/MaximumTotalPricePreference"
        stars:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            type: integer
            minimum: 0
            maximum: 5
        minimumGuestRating:
          type: integer
          enum:
            - 5
            - 6
            - 7
            - 8
            - 9
        freeCancellationRequired:
          type: boolean
          enum:
            - true
      additionalProperties: false

    MaximumTotalPricePreference:
      type: object
      required:
        - amount
        - currency
      properties:
        amount:
          type: string
          pattern: "^[0-9]+(?:\\.[0-9]+)?$"
          description: Exact decimal constraint without floating-point conversion.
        currency:
          type: string
          enum:
            - RUB
      additionalProperties: false

    HotelSearchRefinementSuggestion:
      type: object
      required:
        - type
        - preference
        - message
      properties:
        type:
          type: string
          enum:
            - relax_preference
        preference:
          type: string
          enum:
            - minimumGuestRating
            - stars
            - freeCancellationRequired
            - maxTotalPrice
        message:
          type: string
          minLength: 1
      additionalProperties: false

    HotelOffer:
      type: object
      required:
        - offerId
        - providerOfferRef
        - hotelName
        - location
        - price
        - availability
        - source
        - freshness
        - matchSummary
        - providerFacts
      properties:
        offerId:
          type: string
          description: Opaque client-facing offer identifier.
        providerOfferRef:
          type: string
          description: Opaque provider reference, not a provider DTO.
        hotelName:
          type: string
        location:
          $ref: "#/components/schemas/HotelLocation"
        price:
          $ref: "#/components/schemas/HotelPrice"
        rating:
          $ref: "#/components/schemas/HotelRating"
          description: Omitted when guest review data is unknown.
        amenities:
          type: array
          description: Omitted when the list response does not provide amenity facts.
          items:
            $ref: "#/components/schemas/HotelAmenity"
        starRating:
          type: integer
          minimum: 0
          maximum: 5
          description: Omitted when the provider does not return a hotel category.
        freeCancellationUntil:
          type: string
          format: date-time
          description: Omitted when a free-cancellation deadline is unknown.
        availability:
          type: string
          enum:
            - available
            - limited
            - unknown
        source:
          type: string
          description: Human-readable source marker when available.
        freshness:
          type: string
          enum:
            - fresh
            - stale
            - unknown
        matchSummary:
          type: string
          description: Assistant-generated summary grounded in criteria and provider facts.
        providerFacts:
          type: array
          items:
            $ref: "#/components/schemas/ProviderFact"
      additionalProperties: false

    SearchResultMetadata:
      type: object
      required:
        - resultCompleteness
        - freshness
        - providerState
        - warnings
      properties:
        resultCompleteness:
          type: string
          enum:
            - complete
            - partial
            - unknown
        freshness:
          type: string
          enum:
            - fresh
            - stale
            - unknown
        providerState:
          type: string
          enum:
            - available
            - degraded
            - unavailable
            - failed
            - unknown
        warnings:
          type: array
          items:
            type: string
      additionalProperties: false

    HotelSearchFailure:
      type: object
      required:
        - category
        - message
      properties:
        category:
          type: string
          enum:
            - provider_unavailable
            - provider_failed
            - search_failed
            - unknown
        message:
          type: string
        retryable:
          type: boolean
        occurredAt:
          type: string
          format: date-time

    ProviderFact:
      type: object
      required:
        - field
        - value
        - source
        - freshness
      properties:
        field:
          type: string
        value:
          type: string
        source:
          type: string
          description: Generic source label when available; not a provider DTO.
        freshness:
          type: string
          enum:
            - fresh
            - stale
            - unknown
      additionalProperties: false

    UserPreference:
      type: object
      required:
        - field
        - value
      properties:
        field:
          type: string
        value:
          type: string
        strength:
          type: string
          enum:
            - required
            - preferred
            - optional
        source:
          type: string
          enum:
            - user_message
            - clarification

    AssistantAssumption:
      type: object
      required:
        - field
        - value
        - reason
      properties:
        field:
          type: string
        value:
          type: string
        reason:
          type: string
        needsConfirmation:
          type: boolean
          default: false

    DerivedAssumption:
      type: object
      required:
        - category
        - field
        - value
        - reason
      properties:
        category:
          type: string
          enum:
            - room_count
            - guest_count
            - date_interpretation
            - budget_tier
            - location_preference
            - other
        field:
          type: string
        value:
          type:
            - string
            - number
            - boolean
        reason:
          type: string
        needsConfirmation:
          type: boolean
          default: true

    UnknownData:
      type: object
      required:
        - field
        - reason
      properties:
        field:
          type: string
        reason:
          type: string
        decisionCritical:
          type: boolean
          default: false

    HotelPrice:
      type: object
      required:
        - amount
        - currency
        - basis
        - includesTaxesAndFees
        - providerFreshness
      properties:
        amount:
          type: number
          minimum: 0
        currency:
          type: string
          minLength: 3
          maxLength: 3
          example: EUR
        basis:
          type: string
          enum:
            - per_night
            - total_stay
            - unknown
        includesTaxesAndFees:
          type: string
          enum:
            - yes
            - no
            - unknown
        providerFreshness:
          type: string
          enum:
            - fresh
            - stale
            - unknown
      additionalProperties: false

    HotelLocation:
      type: object
      required:
        - city
        - country
      properties:
        city:
          type: string
        country:
          type: string
      additionalProperties: false

    HotelRating:
      type: object
      required:
        - value
        - scale
        - reviewCount
        - source
      properties:
        value:
          type: number
          minimum: 0
        scale:
          type: number
          minimum: 0
          example: 10
        reviewCount:
          type: integer
          minimum: 0
        source:
          type: string
      additionalProperties: false

    HotelAmenity:
      type: object
      required:
        - name
        - source
      properties:
        name:
          type: string
        source:
          type: string
          enum:
            - provider_fact
            - assistant_assumption
            - unknown
      additionalProperties: false

    ShortlistItem:
      type: object
      required:
        - itemId
        - sessionId
        - offerId
        - addedAt
      properties:
        itemId:
          type: string
        sessionId:
          type: string
        offerId:
          type: string
        addedAt:
          type: string
          format: date-time
        note:
          type: string
          maxLength: 1000
        offer:
          $ref: "#/components/schemas/HotelOffer"
        freshness:
          type: string
          enum:
            - fresh
            - stale
            - unknown

    ShortlistItemRequest:
      type: object
      properties:
        note:
          type: string
          maxLength: 1000
      additionalProperties: false

    ShortlistResponse:
      type: object
      required:
        - sessionId
        - items
      properties:
        sessionId:
          type: string
        items:
          type: array
          items:
            $ref: "#/components/schemas/ShortlistItem"

    AssistantExplanationRequest:
      type: object
      required:
        - offerIds
        - mode
      properties:
        offerIds:
          type: array
          minItems: 1
          maxItems: 5
          items:
            type: string
        mode:
          type: string
          enum:
            - explain
            - compare
        question:
          type: string
          maxLength: 2000
      additionalProperties: false

    AssistantExplanationResponse:
      type: object
      required:
        - mode
        - content
      properties:
        mode:
          type: string
          enum:
            - explain
            - compare
        content:
          type: string
        providerFactsUsed:
          type: array
          items:
            $ref: "#/components/schemas/ProviderFact"
        assistantAssumptions:
          type: array
          items:
            $ref: "#/components/schemas/AssistantAssumption"
        derivedAssumptions:
          type: array
          items:
            $ref: "#/components/schemas/DerivedAssumption"
        unknowns:
          type: array
          items:
            $ref: "#/components/schemas/UnknownData"

    ErrorResponse:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
          enum:
            - SESSION_NOT_FOUND
            - HOTEL_SEARCH_NOT_FOUND
            - HOTEL_OFFER_NOT_FOUND
            - SHORTLIST_ITEM_NOT_FOUND
            - INTERNAL_ERROR
        message:
          type: string
        requestId:
          type: string
        details:
          type: object
          additionalProperties: true
      additionalProperties: false

    ValidationErrorResponse:
      type: object
      required:
        - code
        - message
        - fields
      properties:
        code:
          type: string
          enum:
            - VALIDATION_ERROR
        message:
          type: string
        requestId:
          type: string
        fields:
          type: array
          items:
            type: object
            required:
              - field
              - message
            properties:
              field:
                type: string
              message:
                type: string
            additionalProperties: false
      additionalProperties: false
